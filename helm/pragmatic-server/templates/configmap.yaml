apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pragmatic-server.fullname" . }}
  labels:
    {{- include "pragmatic-server.labels" . | nindent 4 }}
data:
  {{- /* .Values.tenants is the pre-rename name of .Values.environments, still read for one release. */}}
  environments.json: {{ dict "environments" (.Values.environments | default .Values.tenants | default (dict)) | toJson | quote }}
