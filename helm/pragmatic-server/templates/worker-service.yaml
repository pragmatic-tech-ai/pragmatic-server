{{- if .Values.cluster.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pragmatic-server.fullname" . }}-worker
  labels:
    {{- include "pragmatic-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: mtls
      port: {{ .Values.cluster.worker.port }}
      targetPort: mtls
  selector:
    {{- include "pragmatic-server.componentSelectorLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
{{- end }}
