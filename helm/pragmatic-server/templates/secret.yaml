{{- if and .Release.IsInstall (not .Values.secrets.masterKeyB64) }}
{{- required "secrets.masterKeyB64 is required at install" .Values.secrets.masterKeyB64 }}
{{- end }}
{{- if .Values.secrets.masterKeyB64 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pragmatic-server.fullname" . }}
  labels:
    {{- include "pragmatic-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  PRAGMATIC_MASTER_KEY: {{ .Values.secrets.masterKeyB64 | quote }}
{{- end }}
