{{- if or .Values.secrets.masterKeyB64 (and .Values.redis.url (not .Values.redis.existingSecret)) (and .Values.secrets.provisioned (not .Values.secrets.provisionedExistingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pragmatic-server.fullname" . }}
  labels:
    {{- include "pragmatic-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.masterKeyB64 }}
  PRAGMATIC_MASTER_KEY: {{ .Values.secrets.masterKeyB64 | quote }}
  {{- end }}
  {{- if and .Values.redis.url (not .Values.redis.existingSecret) }}
  redis-url: {{ .Values.redis.url | quote }}
  {{- end }}
  {{- if and .Values.secrets.provisioned (not .Values.secrets.provisionedExistingSecret) }}
  {{ .Values.secrets.provisionedSecretKey }}: {{ .Values.secrets.provisioned | toJson | quote }}
  {{- end }}
{{- end }}
