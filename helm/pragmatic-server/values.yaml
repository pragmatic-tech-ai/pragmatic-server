# replicaCount > 1 is safe ONLY with redis.url set (tenant ownership lease -- one replica owns a tenant at a time).
# Without Redis, keep this at 1: multiple replicas would open the same tenant's file-backed storage concurrently.
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: pragmatic-server
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# local | cloud
deploymentMode: local
baseDir: /data

persistence:
  enabled: true
  size: 1Gi
  # storageClass: ""

# The tenant MAP (the body under the top-level "tenants" key). The chart wraps it as
# {"tenants": {...}} into the ConfigMap's tenants.json (mounted at /cfg/tenants.json).
# e.g. tenants: { acme: { displayName: Acme } }
# Holds secret REFERENCES only, never secret values.
tenants: {}

# Secret placeholders: EMPTY here, supplied at install time (e.g. --set secrets.masterKeyB64=...).
# Never commit a real value.
secrets:
  masterKeyB64: ""
  # Per-tenant OIDC client secrets and bootstrap-admin passwords, keyed by the ref strings used in
  # `tenants` (e.g. "acme/oidc/client-secret", "acme-admin-pw"). DEV CONVENIENCE ONLY -- never commit
  # real values here; for production supply them out-of-band via provisionedExistingSecret.
  provisioned: {}
  provisionedExistingSecret: ""
  provisionedSecretKey: provisioned-secrets.json

# Optional Redis for safe multi-replica operation (tenant ownership lease). Leave url empty for single-replica.
# Supply the URL via this chart's Secret (set redis.url) OR an existing Secret (redis.existingSecret + redis.secretKey).
# The URL may carry credentials -- treat it as a secret; never commit a real value.
redis:
  url: ""
  existingSecret: ""
  secretKey: redis-url

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: pragmatic.example.com
  path: /
  pathType: Prefix
  tls: []

# Only safe in cloud/shared-store mode (deploymentMode: cloud).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
