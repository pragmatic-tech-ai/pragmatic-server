# replicaCount > 1 is safe ONLY with redis.url set (tenant ownership lease -- one replica owns a tenant at a time).
# Without Redis, keep this at 1: multiple replicas would open the same tenant's file-backed storage concurrently.
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: pragmatic-server
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# local | cloud
deploymentMode: local
baseDir: /data

persistence:
  enabled: true
  size: 1Gi
  # storageClass: ""

# The tenant MAP (the body under the top-level "tenants" key). The chart wraps it as
# {"tenants": {...}} into the ConfigMap's tenants.json (mounted at /cfg/tenants.json).
# e.g. tenants: { acme: { displayName: Acme } }
# Holds secret REFERENCES only, never secret values.
# A tenant entry may also carry a `connections` map (id -> { settings, secretRef }); each
# secretRef resolves from `secrets.provisioned` (or provisionedExistingSecret).
tenants: {}

# Secret placeholders: EMPTY here, supplied at install time (e.g. --set secrets.masterKeyB64=...).
# Never commit a real value.
secrets:
  masterKeyB64: ""
  # Per-tenant OIDC client secrets and bootstrap-admin passwords, keyed by the ref strings used in
  # `tenants` (e.g. "acme-oidc-secret", "acme-admin-pw"). DEV CONVENIENCE ONLY -- never commit
  # real values here; for production supply them out-of-band via provisionedExistingSecret.
  provisioned: {}
  provisionedExistingSecret: ""
  provisionedSecretKey: provisioned-secrets.json

# Optional Redis for safe multi-replica operation (tenant ownership lease). Leave url empty for single-replica.
# Supply the URL via this chart's Secret (set redis.url) OR an existing Secret (redis.existingSecret + redis.secretKey).
# The URL may carry credentials -- treat it as a secret; never commit a real value.
redis:
  url: ""
  existingSecret: ""
  secretKey: redis-url

# Client-facing TLS (machine-cert mTLS) for the standalone server. Empty existingSecret = OFF.
# The Secret is operator/cert-manager supplied and must carry tls.crt, tls.key, ca.crt -- never inline here.
# This client CA MUST be distinct from the worker mTLS CA (cluster.tls).
clientTls:
  existingSecret: ""
  mountPath: /run/secrets/client-tls

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: pragmatic.example.com
  path: /
  pathType: Prefix
  tls: []

# Only safe in cloud/shared-store mode (deploymentMode: cloud).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Gateway + worker split (horizontal scale). When enabled the chart deploys a worker StatefulSet
# (file-backed, mutual-TLS, one tenant-owner at a time via the Redis lease) behind a stateless
# gateway Deployment, instead of the single Deployment above. REQUIRES redis.* (the worker
# ownership lease is the single-writer backstop). mTLS material comes from an existing Secret
# (cert-manager or operator supplied: tls.crt, tls.key, ca.crt) -- never inline here.
cluster:
  enabled: false
  tls:
    existingSecret: ""
    mountPath: /run/secrets/tls
  # All workers present one server cert whose SAN is this name; the gateway validates every worker
  # connection against it (connecting to the per-pod DNS address independently).
  workerServerName: pragmatic-worker
  worker:
    # Worker storage is ALWAYS persistent (volumeClaimTemplates), regardless of persistence.enabled.
    replicas: 2
    port: 8443
    healthPort: 8081
  gateway:
    replicas: 2
    port: 8080
    # Optional distinct gateway client cert; defaults to cluster.tls.existingSecret (one shared machine cert).
    tls:
      existingSecret: ""

# Stage-C observability wiring. All OFF by default so the chart renders byte-unchanged when unset.
observability:
  # Prometheus scrape exporter (PRAGMATIC_METRICS_PORT). enabled:false => no metrics port, no scrape annotations.
  metrics:
    enabled: false
    port: 9464
    path: /metrics
  # OTLP export (PRAGMATIC_OTLP_ENDPOINT). The endpoint may carry an auth token -- supply BY REFERENCE:
  # a literal endpoint (observability.otlp.endpoint) OR an existing Secret (otlp.existingSecret + otlp.secretKey).
  # Never commit a real endpoint with embedded credentials.
  otlp:
    endpoint: ""
    existingSecret: ""
    secretKey: otlp-endpoint
    protocol: ""   # http-protobuf | grpc | "" (default)
    metrics: false

# Stage-C graceful drain. All EMPTY by default so the chart renders byte-unchanged when unset.
# When you opt in, set terminationGracePeriodSeconds >= ceil(timeoutMs/1000) + preStopSeconds.
drain:
  timeoutMs: ""                      # e.g. 25000  -> PRAGMATIC_DRAIN_TIMEOUT_MS
  preStopSeconds: ""                 # e.g. 5      -> lifecycle.preStop sleep (let the LB observe the /readyz flip)
  terminationGracePeriodSeconds: ""  # e.g. 35
