# replicaCount must stay 1 in local/file-backed mode; multi-replica needs cloud/shared stores (deferred).
replicaCount: 1

image:
  repository: pragmatic-server
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# local | cloud
deploymentMode: local
baseDir: /data

persistence:
  enabled: true
  size: 1Gi
  # storageClass: ""

# Rendered into the ConfigMap as tenants.json (mounted at /cfg/tenants.json).
# Holds secret REFERENCES only, never secret values.
tenants: {}

# Secret placeholders: EMPTY here, supplied at install time (e.g. --set secrets.masterKeyB64=...).
# Never commit a real value.
secrets:
  masterKeyB64: ""
  oidc: {}
  adminPasswords: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: pragmatic.example.com
  path: /
  pathType: Prefix
  tls: []

# Only safe in cloud/shared-store mode (deploymentMode: cloud).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
