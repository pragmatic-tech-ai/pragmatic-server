# The server consumes its siblings as file:../<pkg> deps, so CI rebuilds the local workspace layout: this repo is
# checked out to $GITHUB_WORKSPACE/pragmatic-server and each sibling is cloned (default branch) beside it.
name: ci
on:
  push:
  pull_request:
jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pragmatic-server
      - name: Clone siblings
        working-directory: ${{ github.workspace }}
        run: |
          for pair in pragmatic-graph:pragmatic-graph todl-runtime:todl-runtime todl:TODL mural:Mural pragmatic-protocol:pragmatic-protocol pragmatic-shared:pragmatic-shared todl-identity-engine:todl-identity-engine todl-connectors-host:todl-connectors-host; do
            git clone --depth 1 "https://github.com/pragmatic-tech-ai/${pair%%:*}.git" "${pair#*:}"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure GitHub Packages auth
        run: |
          printf '@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_TOKEN }}\n' > ~/.npmrc
      - name: Build siblings in dependency order
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in pragmatic-graph todl-runtime Mural TODL pragmatic-protocol pragmatic-shared todl-identity-engine todl-connectors-host; do
            (cd "$pkg" && npm install --no-audit --no-fund && npm run build)
          done
      # The siblings' locks resolve the graph engine and todl-runtime from GitHub Packages (their own CI has no sibling
      # checkout), which would give the workspace second copies beside the server's file:../pragmatic-graph and
      # file:../todl-runtime (a second todl-runtime breaks instanceof across the two). Re-point every copy at the
      # sibling before the server builds so the workspace holds ONE of each, exactly as in local development.
      - name: Point the siblings at the sibling graph engine and todl-runtime
        working-directory: ${{ github.workspace }}
        run: sh pragmatic-server/docker/link-workspace-singletons.sh .
      - name: Build pragmatic-server
        working-directory: ${{ github.workspace }}/pragmatic-server
        run: npm install --no-audit --no-fund && npm run build
      # Each app image copies only the siblings its entry reaches: closure.json, the Dockerfile and the code must agree.
      # Run with the server's locked tsx; the check resolves the workspace root from its own location.
      - name: Image closure check
        working-directory: ${{ github.workspace }}/pragmatic-server
        run: npx tsx docker/images/closure-check.ts
      - name: Test
        working-directory: ${{ github.workspace }}/pragmatic-server
        run: npx tsx --test "src/**/*.test.ts"
      # The control-plane suite (release toolkit, catalogue, tenant-admin closure guard) and the image tooling. Every test
      # that needs a local-only resource is gated (the dev-ca-trust.ps1 suite runs on Windows only; the POSIX-mode checks
      # skip where modes are unsupported); docker, kubectl and kind are faked throughout, and openssl is on the runner.
      - name: Test the control plane
        working-directory: ${{ github.workspace }}/pragmatic-server
        run: npx tsx --test "admin/control-plane/**/*.test.ts"
      - name: Test the image tooling
        working-directory: ${{ github.workspace }}/pragmatic-server
        run: npx tsx --test "docker/images/tests/*.test.ts"
      - name: IdP sign-in app (unit tests + typecheck)
        working-directory: ${{ github.workspace }}/pragmatic-server/idp-login
        run: |
          npm install --no-audit --no-fund && npm test && npm run typecheck
      # One image per app (docker/docker-bake.hcl), built but not pushed; release.yml publishes them. Two steps: the
      # component descriptors and their bake override first (pragmatic-components, into pragmatic-server/docker/.components),
      # then the images, each labelled with its descriptor digest; every image is then checked to carry that descriptor.
      - name: Docker build
        working-directory: ${{ github.workspace }}
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/npmrc"' EXIT
          (umask 077 && printf '@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGES_TOKEN" > "$RUNNER_TEMP/npmrc")
          NPMRC_FILE="$RUNNER_TEMP/npmrc" docker buildx bake -f pragmatic-server/docker/docker-bake.hcl --allow=fs.read="$RUNNER_TEMP/npmrc" pragmatic-components
          NPMRC_FILE="$RUNNER_TEMP/npmrc" VERSION=ci SERVER_SHA="$GITHUB_SHA" docker buildx bake -f pragmatic-server/docker/docker-bake.hcl \
            -f pragmatic-server/docker/.components/docker-bake.components.json --allow=fs.read="$RUNNER_TEMP/npmrc"
      - name: Component descriptor in every image matches its label
        working-directory: ${{ github.workspace }}
        run: |
          images=()
          for app in pragmatic-platform-admin pragmatic-platform-edge pragmatic-env-server pragmatic-env-gateway pragmatic-hive-agent pragmatic-tenant-admin pragmatic-tenant-idp pragmatic-ui-unpack pragmatic-postgres; do
            images+=("ghcr.io/pragmatic-tech-ai/$app:ci")
          done
          bash pragmatic-server/docker/images/check-component-label.sh "${images[@]}"
      # pragmatic-postgres end to end on the image just baked: two applications, isolation, a restart with a third, a
      # changed password file, a refused start (docker/postgres/tests/image.test.sh removes what it creates).
      - name: pragmatic-postgres image test
        working-directory: ${{ github.workspace }}
        run: bash pragmatic-server/docker/postgres/tests/image.test.sh ghcr.io/pragmatic-tech-ai/pragmatic-postgres:ci
      - name: Helm lint + template
        working-directory: ${{ github.workspace }}
        run: |
          helm lint pragmatic-server/helm/pragmatic-server
          helm template pragmatic-server/helm/pragmatic-server
  # The four multi-arch images, built natively on arm64 (as release.yml does), without pushing.
  platform-images-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          path: pragmatic-server
      - name: Clone siblings
        working-directory: ${{ github.workspace }}
        run: |
          for pair in pragmatic-graph:pragmatic-graph todl-runtime:todl-runtime todl:TODL mural:Mural pragmatic-protocol:pragmatic-protocol pragmatic-shared:pragmatic-shared todl-identity-engine:todl-identity-engine todl-connectors-host:todl-connectors-host; do
            git clone --depth 1 "https://github.com/pragmatic-tech-ai/${pair%%:*}.git" "${pair#*:}"
          done
      - uses: docker/setup-buildx-action@v3
      - name: Docker build (arm64)
        working-directory: ${{ github.workspace }}
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/npmrc"' EXIT
          (umask 077 && printf '@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGES_TOKEN" > "$RUNNER_TEMP/npmrc")
          NPMRC_FILE="$RUNNER_TEMP/npmrc" PLATFORMS=linux/arm64 docker buildx bake -f pragmatic-server/docker/docker-bake.hcl --allow=fs.read="$RUNNER_TEMP/npmrc" pragmatic-components
          NPMRC_FILE="$RUNNER_TEMP/npmrc" PLATFORMS=linux/arm64 VERSION=ci SERVER_SHA="$GITHUB_SHA" docker buildx bake -f pragmatic-server/docker/docker-bake.hcl \
            -f pragmatic-server/docker/.components/docker-bake.components.json --allow=fs.read="$RUNNER_TEMP/npmrc" pragmatic-platform-admin pragmatic-platform-edge pragmatic-postgres pragmatic-tenant-idp
      # The arm64 pragmatic-postgres, loaded into the runner's docker and run through the same end-to-end test.
      - name: pragmatic-postgres image test (arm64)
        working-directory: ${{ github.workspace }}
        run: |
          PLATFORMS=linux/arm64 VERSION=ci SERVER_SHA="$GITHUB_SHA" docker buildx bake -f pragmatic-server/docker/docker-bake.hcl \
            -f pragmatic-server/docker/.components/docker-bake.components.json --load pragmatic-postgres
          bash pragmatic-server/docker/images/check-component-label.sh ghcr.io/pragmatic-tech-ai/pragmatic-postgres:ci
          bash pragmatic-server/docker/postgres/tests/image.test.sh ghcr.io/pragmatic-tech-ai/pragmatic-postgres:ci
