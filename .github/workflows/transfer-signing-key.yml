# One-shot (dev-kit A3 Task 12): copies this repository's RELEASE_SIGNING_KEY into pragmatic-platform-release's
# secret of the same name without the value leaving GitHub. Dispatched once, then this file and the temporary
# SECRET_TRANSFER_TOKEN secret are deleted (Task 14 deletes RELEASE_SIGNING_KEY here before archiving).
name: transfer-signing-key
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Set the signing key on pragmatic-platform-release
        env:
          GH_TOKEN: ${{ secrets.SECRET_TRANSFER_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          printf '%s\n' "$RELEASE_SIGNING_KEY" | gh secret set RELEASE_SIGNING_KEY -R pragmatic-tech-ai/pragmatic-platform-release
