# Publishes a release from a `release/X.Y.Z` (stable) or `release/X.Y.Z-early.N` (early access) tag on this repo:
# builds the nine app images (docker/docker-bake.hcl), pushes them to ghcr.io/pragmatic-tech-ai tagged :X.Y.Z and
# :git-<server sha>, then signs each image digest and pushes the signed release descriptor (pragmatic-release:X.Y.Z).
# The three platform images (platform-admin, platform-edge, postgres) are multi-arch: the platform-images job builds
# each arch on its own native runner (no QEMU) and pushes it by digest; the release job joins both digests under the
# version tags (docker buildx imagetools create), so the descriptor records and signs the multi-arch index digest. The
# other six images are linux/amd64 only.
# Only this repo is tagged: every sibling builds from its default-branch head (cloned exactly as ci.yml clones it; some
# siblings' default branch is `master`). The siblings job resolves those heads ONCE into siblings.json; every image
# build fetches exactly those commits, and the descriptor records the same file, so all nine images and the signed
# provenance agree even if a sibling moves during the run.
# The publish-side release toolkit tests run first (they import only node builtins, so no npm install is needed); the
# image closure check runs inside the shared build stage of docker/images/Dockerfile. tsx is pinned to the server's locked version.
# Secrets: PACKAGES_TOKEN (read:packages, for the build's npm installs) and RELEASE_SIGNING_KEY (the Ed25519 private
# key PEM whose public half is release-keys/release-2026-11.pub.pem). Neither is echoed, put on a command line or
# baked into a layer; both files are removed whatever the outcome.
name: release
on:
  push:
    tags: ['release/*']
permissions:
  contents: read
  packages: write
jobs:
  siblings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          path: pragmatic-server
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Fails fast on a malformed tag or an already-published version, before any clone or build.
      - name: Check the release tag
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_REGISTRY_USER: ${{ github.actor }}
          RELEASE_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes tsx@4.23.15 pragmatic-server/admin/control-plane/bin/pragmatic-release-publish.ts check --tag "$GITHUB_REF"
      - name: Clone siblings at their default-branch head
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/siblings"
          siblings='{}'
          for pair in pragmatic-graph:pragmatic-graph todl-runtime:todl-runtime todl:TODL mural:Mural pragmatic-protocol:pragmatic-protocol pragmatic-shared:pragmatic-shared todl-identity-engine:todl-identity-engine todl-connectors-host:todl-connectors-host; do
            repo="${pair%%:*}"
            dir="${pair#*:}"
            git clone --depth 1 "https://github.com/pragmatic-tech-ai/${repo}.git" "$dir"
            siblings=$(jq -c --arg repo "$repo" --arg sha "$(git -C "$dir" rev-parse HEAD)" '. + {($repo): $sha}' <<< "$siblings")
          done
          printf '%s\n' "$siblings" > "$RUNNER_TEMP/siblings/siblings.json"
          cat "$RUNNER_TEMP/siblings/siblings.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: siblings
          path: ${{ runner.temp }}/siblings/siblings.json
          retention-days: 1
  platform-images:
    needs: siblings
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          path: pragmatic-server
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check the release tag
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_REGISTRY_USER: ${{ github.actor }}
          RELEASE_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes tsx@4.23.15 pragmatic-server/admin/control-plane/bin/pragmatic-release-publish.ts check --tag "$GITHUB_REF"
      - name: Test the release toolkit
        working-directory: ${{ github.workspace }}
        run: npx --yes tsx@4.23.15 --test "pragmatic-server/admin/control-plane/release/tests/release-descriptor.test.ts" "pragmatic-server/admin/control-plane/release/tests/release-publisher.test.ts" "pragmatic-server/admin/control-plane/release/tests/release-signature.test.ts" "pragmatic-server/admin/control-plane/release/tests/release-tag.test.ts" "pragmatic-server/admin/control-plane/release/tests/release-trust-keys.test.ts"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: siblings
          path: ${{ runner.temp }}/siblings
      - name: Fetch the siblings at the recorded commits
        working-directory: ${{ github.workspace }}
        run: |
          for pair in pragmatic-graph:pragmatic-graph todl-runtime:todl-runtime todl:TODL mural:Mural pragmatic-protocol:pragmatic-protocol pragmatic-shared:pragmatic-shared todl-identity-engine:todl-identity-engine todl-connectors-host:todl-connectors-host; do
            repo="${pair%%:*}"
            dir="${pair#*:}"
            sha=$(jq -r --arg repo "$repo" '.[$repo]' "$RUNNER_TEMP/siblings/siblings.json")
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "https://github.com/pragmatic-tech-ai/${repo}.git" "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
          done
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Write the npm registry credentials
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          umask 077
          printf '@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGES_TOKEN" > "$RUNNER_TEMP/npmrc"
      # Each arch is pushed untagged (by digest); the release job tags the joined index.
      - name: Build and push the platform images for this arch, by digest
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          NPMRC_FILE="$RUNNER_TEMP/npmrc" PLATFORMS=linux/${{ matrix.arch }} docker buildx bake -f pragmatic-server/docker/docker-bake.hcl --allow=fs.read="$RUNNER_TEMP/npmrc" \
            --metadata-file "$RUNNER_TEMP/bake-meta.json" \
            --set pragmatic-platform-admin.tags=ghcr.io/pragmatic-tech-ai/pragmatic-platform-admin --set pragmatic-platform-edge.tags=ghcr.io/pragmatic-tech-ai/pragmatic-platform-edge \
            --set pragmatic-postgres.tags=ghcr.io/pragmatic-tech-ai/pragmatic-postgres \
            --set '*.output=type=image,push-by-digest=true,name-canonical=true,push=true' \
            pragmatic-platform-admin pragmatic-platform-edge pragmatic-postgres
          rm -f "$RUNNER_TEMP/npmrc"
          for app in pragmatic-platform-admin pragmatic-platform-edge pragmatic-postgres; do
            jq -r --arg app "$app" '.[$app]["containerimage.digest"]' "$RUNNER_TEMP/bake-meta.json" > "$RUNNER_TEMP/digests/$app"
            grep -Eq '^sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/digests/$app"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          retention-days: 1
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/npmrc"
  release:
    needs: [siblings, platform-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          path: pragmatic-server
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Fails fast on a malformed tag or an already-published version, before any clone or build.
      - name: Check the release tag
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_REGISTRY_USER: ${{ github.actor }}
          RELEASE_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes tsx@4.23.15 pragmatic-server/admin/control-plane/bin/pragmatic-release-publish.ts check --tag "$GITHUB_REF"
      - name: Test the release toolkit
        working-directory: ${{ github.workspace }}
        run: npx --yes tsx@4.23.15 --test "pragmatic-server/admin/control-plane/release/tests/release-descriptor.test.ts" "pragmatic-server/admin/control-plane/release/tests/release-publisher.test.ts" "pragmatic-server/admin/control-plane/release/tests/release-signature.test.ts" "pragmatic-server/admin/control-plane/release/tests/release-tag.test.ts" "pragmatic-server/admin/control-plane/release/tests/release-trust-keys.test.ts"
      # The version is the tag's X.Y.Z[-early.N] (already validated above); the server commit is the tagged checkout.
      - name: Resolve version and server commit
        working-directory: ${{ github.workspace }}
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/release/}" >> "$GITHUB_ENV"
          echo "SERVER_SHA=$(git -C pragmatic-server rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: siblings
          path: ${{ runner.temp }}/siblings
      - name: Fetch the siblings at the recorded commits
        working-directory: ${{ github.workspace }}
        run: |
          for pair in pragmatic-graph:pragmatic-graph todl-runtime:todl-runtime todl:TODL mural:Mural pragmatic-protocol:pragmatic-protocol pragmatic-shared:pragmatic-shared todl-identity-engine:todl-identity-engine todl-connectors-host:todl-connectors-host; do
            repo="${pair%%:*}"
            dir="${pair#*:}"
            sha=$(jq -r --arg repo "$repo" '.[$repo]' "$RUNNER_TEMP/siblings/siblings.json")
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "https://github.com/pragmatic-tech-ai/${repo}.git" "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
          done
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Write the npm registry credentials
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          umask 077
          printf '@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGES_TOKEN" > "$RUNNER_TEMP/npmrc"
      - name: Build and push the amd64-only app images
        working-directory: ${{ github.workspace }}
        run: |
          NPMRC_FILE="$RUNNER_TEMP/npmrc" docker buildx bake -f pragmatic-server/docker/docker-bake.hcl --push --allow=fs.read="$RUNNER_TEMP/npmrc" amd64-only
          rm -f "$RUNNER_TEMP/npmrc"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: platform-digests-*
          path: ${{ runner.temp }}/platform-digests
      # One tag pair per platform image over both arches' digests: the version tag then names the multi-arch index.
      - name: Join the platform images' arches under the version tags
        run: |
          for app in pragmatic-platform-admin pragmatic-platform-edge pragmatic-postgres; do
            amd64=$(cat "$RUNNER_TEMP/platform-digests/platform-digests-amd64/$app")
            arm64=$(cat "$RUNNER_TEMP/platform-digests/platform-digests-arm64/$app")
            docker buildx imagetools create -t "ghcr.io/pragmatic-tech-ai/$app:$VERSION" -t "ghcr.io/pragmatic-tech-ai/$app:git-$SERVER_SHA" \
              "ghcr.io/pragmatic-tech-ai/$app@$amd64" "ghcr.io/pragmatic-tech-ai/$app@$arm64"
            docker buildx imagetools inspect "ghcr.io/pragmatic-tech-ai/$app:$VERSION"
          done
      - name: Write the release signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release.key"
      - name: Sign and publish the release descriptor
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_SIGNING_KEY_FILE: ${{ runner.temp }}/release.key
          RELEASE_REGISTRY_USER: ${{ github.actor }}
          RELEASE_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes tsx@4.23.15 pragmatic-server/admin/control-plane/bin/pragmatic-release-publish.ts publish --tag "$GITHUB_REF" --server-commit "$SERVER_SHA" --siblings-file "$RUNNER_TEMP/siblings/siblings.json" --key-id release-2026-11
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/release.key" "$RUNNER_TEMP/npmrc"
